[project]
name = "tws_option_scraper_v3"
version = "0.1.0"
description = "Writes tws gateway historic option pricing data into tsql database"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "exscript>=2.6.28",
    "ibapi>=9.81.1.post1",
    "psutil>=7.0.0",
    "pyodbc>=5.2.0",
    "python-dotenv>=1.0.1",
    "pytz>=2025.2",
    "requests>=2.32.3",
    "typing-extensions>=4.12.2",
]


